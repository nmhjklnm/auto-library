<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">AutoLibrary</title>
  <desc id="desc">The library layer every coding agent installs. Skills is just one Volume of it — so are your notes, docs, and playbooks. A session-start hook loads every Volume into every session, on Claude Code and Codex.</desc>
  <defs>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#ECE7DC" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="400" fill="#0E1014"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <!-- ambient depth (tone-on-tone) -->
  <circle cx="1180" cy="46" r="150" fill="none" stroke="#ECE7DC" stroke-opacity=".045" stroke-width="1.5"/>
  <circle cx="1180" cy="46" r="104" fill="none" stroke="#ECE7DC" stroke-opacity=".03" stroke-width="1.5"/>

  <!-- ===== left: title block ===== -->
  <g transform="translate(68 44)">
    <text x="0" y="14" fill="#9A9488" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" font-weight="700" letter-spacing="3.2">THE LIBRARY LAYER · FOR EVERY AGENT</text>
    <rect id="accent-rule" x="0" y="27" width="62" height="5" rx="2.5" fill="#D2A24C"/>

    <text x="-3" y="116" fill="#ECE7DC" font-family="Georgia,'Noto Serif','Songti SC',serif" font-size="76" letter-spacing="-1">AutoLibrary</text>

    <text x="0" y="162" fill="#ECE7DC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="26" font-weight="600">A library every agent installs.</text>

    <text x="0" y="198" fill="#B7AE9B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="19" font-weight="450">Skills is just <tspan fill="#D2A24C" font-weight="600">one Volume</tspan> of it.</text>

    <text x="0" y="238" fill="#8E8A7E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" font-weight="450">Register anything as a Volume — every agent loads it at session start.</text>

    <text x="0" y="312" fill="#6E6A5F" font-family="ui-monospace,'SF Mono','DejaVu Sans Mono',Menlo,monospace" font-size="15" letter-spacing=".3">nmhjklnm / auto-library   ·   MIT   ·   Claude Code + Codex CLI</text>
  </g>

  <!-- ===== right: the shelf (Library of Volumes; Skills is one row) ===== -->
  <g id="motion-card-index" transform="translate(712 76)" font-family="ui-monospace,'SF Mono','DejaVu Sans Mono',Menlo,monospace">
    <rect x="0" y="0" width="420" height="248" rx="14" fill="#14161C" stroke="#2B2E37" stroke-width="1"/>
    <circle cx="24" cy="30" r="4" fill="#D2A24C"/>
    <text x="40" y="34.5" fill="#9A9488" font-size="14.5">your library</text>
    <text x="398" y="33.5" text-anchor="end" fill="#55524A" font-size="13">auto-library</text>
    <line x1="20" y1="52" x2="400" y2="52" stroke="#23252D" stroke-width="1"/>
  </g>

  <g id="idx-line-1" transform="translate(712 76)" font-family="ui-monospace,'SF Mono','DejaVu Sans Mono',Menlo,monospace">
    <text x="24" y="90" fill="#D2A24C" font-size="18">▸</text>
    <text x="46" y="90" fill="#E4DFD4" font-size="19">skills</text>
    <text x="232" y="90" fill="#7E7A6E" font-size="15">12 skills</text>
  </g>
  <g id="idx-line-2" transform="translate(712 76)" font-family="ui-monospace,'SF Mono','DejaVu Sans Mono',Menlo,monospace">
    <text x="24" y="126" fill="#D2A24C" font-size="18">▸</text>
    <text x="46" y="126" fill="#E4DFD4" font-size="19">capabilities</text>
    <text x="232" y="126" fill="#7E7A6E" font-size="15">27 entries</text>
    <text x="24" y="162" fill="#D2A24C" font-size="18">▸</text>
    <text x="46" y="162" fill="#E4DFD4" font-size="19">devices</text>
    <text x="232" y="162" fill="#7E7A6E" font-size="15">6 machines</text>
  </g>
  <g id="idx-line-3" transform="translate(712 76)" font-family="ui-monospace,'SF Mono','DejaVu Sans Mono',Menlo,monospace">
    <text x="24" y="198" fill="#D2A24C" font-size="18">▸</text>
    <text x="46" y="198" fill="#E4DFD4" font-size="19">ideas</text>
    <text x="232" y="198" fill="#7E7A6E" font-size="15">31 ideas</text>
    <line x1="20" y1="220" x2="400" y2="220" stroke="#23252D" stroke-width="1"/>
    <text x="22" y="240" fill="#6E6A5F" font-size="13.5">loaded every session · Claude Code · Codex</text>
  </g>
</svg>
